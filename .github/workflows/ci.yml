name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: sparkbooks_test }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mbstring, pdo_mysql" }
      - run: composer install --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run build
      - run: php artisan test
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_DATABASE: sparkbooks_test, DB_USERNAME: root, DB_PASSWORD: "" }
      - name: No float on money paths
        run: |
          if grep -rniE '\((float|double)\)' app/ | grep -iE 'debit|credit|amount|balance|total|money|minor'; then echo 'Float cast on a money path — use integer minor units.'; exit 1; fi
      - run: vendor/bin/pint --test
